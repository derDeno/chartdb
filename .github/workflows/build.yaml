name: Docker build and publish

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
    tags:
      - 'v*'
      - 'docker-run-*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-branch-image:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Log in to the Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=nightly,enable=${{ startsWith(github.ref, 'refs/heads/feat/') }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Find reusable image for main
        id: source
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          source_sha="${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            second_parent="$(git rev-list --parents -n1 "${GITHUB_SHA}" | awk '{print $3}')"
            if [ -n "${second_parent}" ]; then
              source_sha="${second_parent}"
            fi
          fi

          source_image="${IMAGE}:sha-${source_sha:0:7}"
          reusable=false
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            for attempt in {1..60}; do
              if docker buildx imagetools inspect "${source_image}" >/dev/null 2>&1; then
                reusable=true
                break
              fi
              sleep 5
            done
          fi

          echo "source_image=${source_image}" >> "${GITHUB_OUTPUT}"
          echo "reusable=${reusable}" >> "${GITHUB_OUTPUT}"

      - name: Retag reusable main image
        if: steps.source.outputs.reusable == 'true'
        env:
          SOURCE_IMAGE: ${{ steps.source.outputs.source_image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            docker buildx imagetools create \
              --tag "${tag}" \
              "${SOURCE_IMAGE}"
          done <<< "${TAGS}"

      - name: Build and push multi-arch Docker image
        if: steps.source.outputs.reusable != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  retag-release-image:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag the existing commit image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SOURCE_TAG="sha-${COMMIT_SHA:0:7}"
          SOURCE_IMAGE="${IMAGE}:${SOURCE_TAG}"

          for attempt in {1..60}; do
            if docker buildx imagetools inspect "${SOURCE_IMAGE}" >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "Timed out waiting for ${SOURCE_IMAGE}" >&2
              exit 1
            fi
            sleep 5
          done

          if [[ "${RELEASE_TAG}" == v* ]]; then
            VERSION="${RELEASE_TAG#v}"
            MAJOR_MINOR="$(printf '%s' "${VERSION}" | cut -d. -f1-2)"
            docker buildx imagetools create \
              --tag "${IMAGE}:${VERSION}" \
              --tag "${IMAGE}:${RELEASE_TAG}" \
              --tag "${IMAGE}:${MAJOR_MINOR}" \
              "${SOURCE_IMAGE}"
          else
            docker buildx imagetools create \
              --tag "${IMAGE}:${RELEASE_TAG}" \
              "${SOURCE_IMAGE}"
          fi
